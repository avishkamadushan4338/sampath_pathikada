name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: sampath-pathikada-platform

env:
  DATABASE_URL: "mysql://user:password@localhost:3306/sampath_pathikada"
  JWT_SECRET: "ci-only-secret-value-not-used-in-production-00000000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3004"
  NODE_ENV: "production"
  # lib/rate-limit.test.ts exercises the real RedisRateLimiter (not just the
  # in-memory fallback) against this service container, so CI actually proves
  # the distributed backend works rather than only the dev-fallback path.
  RATE_LIMIT_REDIS_URL: "redis://localhost:6379"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sampath-pathikada-platform/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      # Blocks the build on new CRITICAL-severity advisories (e.g. the next@15.3.3
      # RCE this repo shipped with previously). Set to critical-only rather than
      # high: as of this writing, xlsx has an unfixed high-severity advisory with
      # no available patch on npm (write-only usage in this app — see
      # app/api/export/excel/route.ts), and next's own internal sharp copy needs a
      # major Next version bump to clear — both are accepted/tracked risks, not
      # things a red CI run can fix. Revisit this threshold once either is resolved.
      - name: Dependency security audit
        run: npm audit --audit-level=critical

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: sampath-pathikada-platform
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
